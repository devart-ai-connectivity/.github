name: Documentation issue
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation.

        Use this form for missing, unclear, outdated, or incorrect docs.
        For reproducible product bugs, please use the Bug report form instead.

  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which repository is this about?
      placeholder: e.g. mcp-server-universal
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected page or file
      description: Which README, doc page, or file needs to be fixed?
      placeholder: e.g. README.md, installation docs, integration guide
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: Type of documentation issue
      options:
        - Missing information
        - Incorrect information
        - Unclear instructions
        - Outdated content
        - Broken link
        - Typo / wording issue
        - Missing example
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: Describe what is missing, incorrect, or confusing.
      placeholder: Explain what was unclear or wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should be changed?
      description: Describe the improvement you would expect.
      placeholder: Suggest the correction, missing step, or example that would help.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, links, product version, or setup context if relevant.
      placeholder: Any extra details that will help us update the docs.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues before submitting this documentation issue.
          required: true
