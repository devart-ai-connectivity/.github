name: Bug report
description: Report a reproducible problem with a Devart MCP Server repository
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please provide enough detail for us to reproduce the issue.
        Do not include secrets, passwords, tokens, API keys, private connection strings, or customer data.

  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which MCP Server product is affected?
      options:
        - MCP Server Universal
        - MCP Server for ASE
        - MCP Server for Firebird
        - MCP Server for Microsoft Access
        - MCP Server for MySQL
        - MCP Server for Oracle
        - MCP Server for PostgreSQL
        - MCP Server for SQLite
        - MCP Server for SQL Server
        - MCP Server for xBase
        - MCP Server for Dynamics 365
        - MCP Server for Dynamics 365 Business Central
        - MCP Server for HubSpot
        - MCP Server for NetSuite
        - MCP Server for QuickBooks Online
        - MCP Server for Salesforce
        - MCP Server for Salesforce Marketing Cloud
        - MCP Server for Snowflake
        - MCP Server for Zoho CRM
        - MCP Server for Zoho Desk
        - Other / Not sure
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which repository are you using?
      placeholder: e.g. mcp-server-postgresql
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Product version
      description: What version are you using?
      placeholder: e.g. 0.9.0 or beta build
    validations:
      required: true

  - type: dropdown
    id: ai_tool
    attributes:
      label: AI tool
      description: Which AI tool are you using?
      options:
        - Claude Desktop
        - GitHub Copilot
        - JetBrains IDE
        - Other AI IDE
        - Other
        - Not sure
    validations:
      required: true

  - type: input
    id: odbc_driver
    attributes:
      label: ODBC driver
      description: Which ODBC driver is being used?
      placeholder: e.g. Devart ODBC Driver for PostgreSQL 4.x
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection type
      description: Which setup are you using?
      options:
        - Single-source MCP Server
        - Universal MCP Server - Use existing DSN
        - Universal MCP Server - Config custom connection
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: read_only
    attributes:
      label: Read-only mode
      description: Was read-only mode enabled?
      options:
        - Yes
        - No
        - Not sure
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Which operating system are you using?
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please list the exact steps needed to reproduce the issue.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Connect ...
        4. Run ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: Describe what actually happened. Include exact error text if possible.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or additional context
      description: Paste sanitized logs or add any other useful context. Remove secrets before posting.
      placeholder: Add logs, screenshots, stack traces, or notes here.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues before submitting this report.
          required: true
        - label: I removed secrets, credentials, tokens, and private data from this report.
          required: true
